  const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const form = document.getElementById("f"), msg = document.getElementById("m"),
        btn = document.getElementById("b");
  if(!(window.crypto && crypto.subtle) || typeof DecompressionStream === "undefined"){
    msg.textContent = "Этот браузер слишком старый: откройте ссылку в свежем Chrome, Safari или Firefox.";
    btn.disabled = true;
    return;
  }
  form.onsubmit = async e => {
    e.preventDefault();
    btn.disabled = true; msg.textContent = ""; btn.textContent = "Расшифровываю…";
    try{
      const pw = document.getElementById("p").value.normalize("NFC").trim();
      const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw),
        "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey(
        {name: "PBKDF2", salt: bytes(S.salt), iterations: S.iterations, hash: "SHA-256"},
        base, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
      let plain;
      try{
        plain = await crypto.subtle.decrypt({name: "AES-GCM", iv: bytes(S.iv)}, key, bytes(S.data));
      }catch(err){
        msg.textContent = "Неверный пароль.";
        btn.disabled = false; btn.textContent = "Открыть";
        return;
      }
      const html = await new Response(new Blob([plain]).stream()
        .pipeThrough(new DecompressionStream("deflate"))).text();
      // Ошибку страницы — на экран: на телефоне консоли нет, а без текста
      // ошибки не понять, что сломалось. Только текст и строка, без данных.
      const show = text => {
        const bar = document.createElement("div");
        bar.style.cssText = "background:#a8352f;color:#fff;padding:8px 12px;font:13px system-ui";
        bar.textContent = "Ошибка страницы: " + text;
        document.body.prepend(bar);
      };
      window.addEventListener("error", ev =>
        show((ev.message || "неизвестная") + (ev.lineno ? " (строка " + ev.lineno + ")" : "")));
      window.addEventListener("unhandledrejection", ev =>
        show(String((ev.reason && ev.reason.message) || ev.reason)));
      // Не document.write: 27.10.2026 на телефоне владельца страница после
      // него осталась на «загрузка…». Разбираем расшифрованное, переносим
      // голову и тело, а скрипты пересоздаём — вставленные через innerHTML
      // они не исполняются, созданные заново исполняются везде.
      const doc = new DOMParser().parseFromString(html, "text/html");
      document.title = doc.title;
      document.head.innerHTML = doc.head.innerHTML;
      document.body.innerHTML = doc.body.innerHTML;
      for(const old of Array.from(document.body.querySelectorAll("script"))){
        const s = document.createElement("script");
        s.textContent = old.textContent;
        old.replaceWith(s);
      }

      msg.textContent = "Не удалось открыть: " + err.message;
      btn.disabled = false; btn.textContent = "Открыть";
